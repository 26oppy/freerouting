name: '🤖 AI Automator'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-ui-test-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  ai_automator:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5

      - name: 'Set up JDK'
        uses: 'actions/setup-java@v4'
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: 'Setup Gradle'
        uses: 'gradle/actions/setup-gradle@v4'

      - name: 'Make Gradle wrapper executable'
        run: chmod +x gradlew

      - name: 'Install UI automation tools'
        run: |-
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick

      - name: 'Prepare screenshot workspace'
        run: |-
          mkdir -p /tmp/ai-automator-screenshots

      - name: 'Check Gemini authentication'
        id: 'check_auth'
        env:
          HAS_GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY != '' }}"
          HAS_GOOGLE_API_KEY: "${{ secrets.GOOGLE_API_KEY != '' }}"
          HAS_WIF_PROVIDER: "${{ vars.GCP_WIF_PROVIDER != '' }}"
        run: |-
          if [[ "${HAS_GEMINI_API_KEY}" != "true" && "${HAS_GOOGLE_API_KEY}" != "true" && "${HAS_WIF_PROVIDER}" != "true" ]]; then
            echo "::error::No Gemini authentication method configured. Please set one of: the GEMINI_API_KEY or GOOGLE_API_KEY secret, or the GCP_WIF_PROVIDER variable."
            exit 1
          fi

      - name: 'Run AI Automator impact analysis'
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          SCREENSHOT_DIR: '/tmp/ai-automator-screenshots'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 20
              },
              "telemetry": {
                "enabled": ${{ vars.GOOGLE_CLOUD_PROJECT != '' }},
                "target": "gcp"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.18.0"
                  ],
                  "includeTools": [
                    "pull_request_read"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(echo)",
                  "run_shell_command(ls)",
                  "run_shell_command(find)",
                  "run_shell_command(timeout)",
                  "run_shell_command(xvfb-run)",
                  "run_shell_command(xdotool)",
                  "run_shell_command(import)",
                  "run_shell_command(./gradlew)"
                ]
              }
            }
          prompt: |-
            You are AI Automator, a UI and routing automation specialist.
            Review PR #${{ env.PULL_REQUEST_NUMBER }} in ${{ env.REPOSITORY }} with strict focus on GUI/interactive impact, UI automation feasibility, and routing safety.
            Additional context: ${{ env.ADDITIONAL_CONTEXT }}
            Screenshot directory for evidence: ${{ env.SCREENSHOT_DIR }}
            Use pull_request_read tools to inspect metadata and changed files, then decide if UI automation is needed.
            Requirements:
            1) Understand repository structure first (focus on interactive/gui/boardgraphics vs headless paths).
            2) If UI impact exists or user requested UI checks, run UI automation commands as needed:
               - execute tutorial board and UI smoke tests,
               - interact with window controls where possible (menus/buttons/tooltips/sliders/open-file style interactions),
               - capture screenshots of observed state and any before/after evidence into SCREENSHOT_DIR.
            3) If UI automation is not needed, explain why and run at least tutorial board smoke coverage.
            4) Keep output concise, actionable, and evidence-backed.
            5) Never fabricate interaction results; only claim actions that were actually executed.

      - name: 'Run AI Automator automated tests (UI + tutorial board + routing smoke)'
        run: |-
          ./gradlew --no-daemon test \
            --tests "app.freerouting.interactive.GuiStartupHeadlessTest" \
            --tests "app.freerouting.interactive.TutorialBoardUiSmokeTest" \
            --tests "app.freerouting.fixtures.Dac2020Bm01RoutingTest"

      - name: 'Capture baseline screenshot artifact'
        run: |-
          xvfb-run -a bash -lc '
            ./gradlew --no-daemon run --args="--gui.enabled=true" >/tmp/ai-automator-run.log 2>&1 &
            APP_PID=$!;
            sleep 12;
            import -window root "/tmp/ai-automator-screenshots/ai-automator-baseline.png" || true;
            WINDOW_ID="$(xdotool search --onlyvisible --name "Freerouting" | head -n 1 || true)";
            if [ -n "${WINDOW_ID}" ]; then
              xdotool windowactivate "${WINDOW_ID}" || true;
              xdotool key --window "${WINDOW_ID}" alt+f || true;
              sleep 1;
              import -window root "/tmp/ai-automator-screenshots/ai-automator-menu.png" || true;
              xdotool key --window "${WINDOW_ID}" Escape || true;
              xdotool key --window "${WINDOW_ID}" ctrl+o || true;
              sleep 1;
              import -window root "/tmp/ai-automator-screenshots/ai-automator-open-file-dialog.png" || true;
              xdotool key --window "${WINDOW_ID}" Escape || true;
            fi
            if [ -n "${APP_PID}" ]; then
              kill "${APP_PID}" || true;
            fi
          '

      - name: 'Upload AI Automator screenshots and logs'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'ai-automator-artifacts'
          if-no-files-found: 'warn'
          path: |-
            /tmp/ai-automator-screenshots/**
            /tmp/ai-automator-run.log
            /home/runner/work/freerouting/freerouting/build/reports/tests/test/**

      - name: 'Report completion'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          MESSAGE: |-
            ✅ AI Automator run completed.
            - Performed AI impact analysis with UI/routing focus.
            - Executed automated tests:
              - `app.freerouting.interactive.GuiStartupHeadlessTest`
              - `app.freerouting.interactive.TutorialBoardUiSmokeTest`
              - `app.freerouting.fixtures.Dac2020Bm01RoutingTest`
            - Captured and uploaded AI Automator screenshots/logs artifact.
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"
