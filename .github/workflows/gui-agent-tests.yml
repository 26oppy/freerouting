name: GUI smoke tests for agent

on:
  pull_request:
  workflow_dispatch:

jobs:
  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run GUI smoke test in virtual display
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./gradlew guiTest
