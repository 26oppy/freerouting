name: '🧪🔎 Gemini Test-Backed Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-test-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  test_review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5

      - name: 'Set up JDK'
        uses: 'actions/setup-java@v4'
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: 'Setup Gradle'
        uses: 'gradle/actions/setup-gradle@v4'

      - name: 'Make Gradle wrapper executable'
        run: chmod +x gradlew

      - name: 'Check Gemini authentication'
        id: 'check_auth'
        env:
          HAS_GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY != '' }}"
          HAS_GOOGLE_API_KEY: "${{ secrets.GOOGLE_API_KEY != '' }}"
          HAS_WIF_PROVIDER: "${{ vars.GCP_WIF_PROVIDER != '' }}"
        run: |-
          if [[ "${HAS_GEMINI_API_KEY}" != "true" && "${HAS_GOOGLE_API_KEY}" != "true" && "${HAS_WIF_PROVIDER}" != "true" ]]; then
            echo "::error::No Gemini authentication method configured. Please set one of: the GEMINI_API_KEY or GOOGLE_API_KEY secret, or the GCP_WIF_PROVIDER variable."
            exit 1
          fi

      - name: 'Run automated tests (required before suggestions)'
        id: 'run_tests'
        env:
          LOG_FILE: '/tmp/gemini-test-review.log'
        run: |-
          set +e
          ./gradlew --no-daemon test \
            --tests "app.freerouting.interactive.GuiStartupHeadlessTest" \
            --tests "app.freerouting.interactive.TutorialBoardUiSmokeTest" \
            --tests "app.freerouting.fixtures.Dac2020Bm01RoutingTest" | tee "${LOG_FILE}"
          TEST_EXIT_CODE="${PIPESTATUS[0]}"
          echo "TEST_EXIT_CODE=${TEST_EXIT_CODE}" >> "${GITHUB_ENV}"
          tail -n 200 "${LOG_FILE}" > /tmp/gemini-test-review-tail.log
          {
            echo "TEST_LOG_TAIL<<EOF"
            cat /tmp/gemini-test-review-tail.log
            echo "EOF"
          } >> "${GITHUB_ENV}"
          exit 0

      - name: 'Run Gemini test-backed review'
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        id: 'gemini_test_review'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          TEST_EXIT_CODE: '${{ env.TEST_EXIT_CODE }}'
          TEST_LOG_TAIL: '${{ env.TEST_LOG_TAIL }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": ${{ vars.GOOGLE_CLOUD_PROJECT != '' }},
                "target": "gcp"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.18.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "create_pending_pull_request_review",
                    "pull_request_read",
                    "submit_pending_pull_request_review"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(echo)"
                ]
              }
            }
          prompt: |-
            ## Role
            You are a test-backed PR review assistant. You must provide review suggestions only when they are supported by the executed test evidence provided below.

            ## Inputs
            - Repository: ${{ env.REPOSITORY }}
            - Pull Request Number: ${{ env.PULL_REQUEST_NUMBER }}
            - Additional Context: ${{ env.ADDITIONAL_CONTEXT }}
            - Test Exit Code: ${{ env.TEST_EXIT_CODE }}
            - Test Log Tail:
            ```
            ${{ env.TEST_LOG_TAIL }}
            ```

            ## Rules
            1. Create a pending review, then add comments, then submit with event `COMMENT`.
            2. If Test Exit Code is non-zero, prioritize comments about failing test evidence and likely root causes in the diff.
            3. If Test Exit Code is zero, only comment on issues where you can justify risk with evidence from test scope and changed code.
            4. Every comment must include one short evidence line beginning with `Evidence:`.
            5. Do not post speculative comments without test-backed rationale.
            6. Use only `mcp__github__*` tools.

            ## Required summary format
            ```
            ## 🧪 Test-Backed Review Summary
            - Test status: PASS|FAIL
            - Evidence basis: short statement
            - Suggestions posted: N
            ```

      - name: 'Post test run status comment'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          TEST_EXIT_CODE: '${{ env.TEST_EXIT_CODE }}'
        run: |-
          if [[ "${TEST_EXIT_CODE}" == "0" ]]; then
            STATUS='PASS'
          else
            STATUS='FAIL'
          fi
          gh issue comment "${ISSUE_NUMBER}" \
            --body "✅ Test-backed AI review completed. Automated test status: **${STATUS}**. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repo "${REPOSITORY}"
