command_line_help=שימוש\n\n  freerouting [PARAMETERS]\n\nפרמטרים\n\n  -de <design.dsn>\n      טוען קובץ Specctra .dsn\n\n  -di <design_directory>\n      מגדיר תיקיית ברירת מחדל לדיאלוגי פתיחת תכנון\n\n  -dr <design_rules_file>\n      קורא כללים מקובץ ‎.rules\n\n  -do <output_file>\n      שומר את הלוח (.dsn), הסשן (.ses) או\n      סקריפט סשן של Eagle (.scr) בסיום\n\n  -mp <number_of_passes>\n      מגדיר את הגבול העליון למספר מעברי האוטו-ראוטר\n\n  -l  <language>\n      "en" לאנגלית, "de" לגרמנית, "zh" לסינית פשוטה, "he" לעברית. אחרת תיבחר שפת המערכת. שפות לא נתמכות יפלו חזרה לאנגלית.\n\n  -mt <number_of_threads>\n      מגדיר את גודל מאגר התהליכונים לאופטימיזציה. ברירת המחדל\n      היא אחד פחות ממספר המעבדים הלוגיים במערכת.\n\n  -us <updating_stratedy>\n      Greedy, Global, Hybrid. מגדיר אסטרטגיית עדכון לוח\n      לאופטימיזציית ניתוב. ברירת המחדל היא Greedy. כשנבחר Hybrid,\n      האפשרות "hr" מגדירה יחס היברידי.\n\n  -hr <m\:n>\n      מגדיר יחס היברידי בפורמט\n      \#_global_optiomal_passes\:\#_prioritized_passes.\n      ברירת המחדל היא 1\:1. תקף רק כאשר נבחרת Hybrid.\n\n  -is <selection_strategy>\n      Sequential, random, or prioritized. מגדיר אסטרטגיית בחירת פריטים\n      לאופטימיזציית ניתוב\: sequential, random, prioritized.\n      ברירת המחדל היא prioritized. אסטרטגיית prioritized בוחרת פריטים\n      לפי ציונים שחושבו בסבב הקודם.\n\n  -h מציג עזרה זו\n
