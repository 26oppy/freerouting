co\\u200E\\u200Emm\\u200E\\u200Eand_line_help=USAGE\n\n  freerouting [PARAMETERS]\n\nPARAMETERS\n\n  -de <design\\u200E\\u200E.dsn\\u200E\\u200E>\n      Loads the \\u200E\\u200ESpecctra\\u200E\\u200E \\u200E\\u200E.dsn\\u200E\\u200E file\n\n  -di <design_directory>\n      Sets the default folder for the open design dialogs\n\n  -dr <design_rules_file>\n      Reads the rules a \\u200E\\u200E.rules\\u200E\\u200E file\n\n  -do <output_file>\n      Saves the board (\\u200E\\u200E.dsn\\u200E\\u200E), the session (\\u200E\\u200E.ses\\u200E\\u200E) or\n      the \\u200E\\u200EEagle\\u200E\\u200E session script (\\u200E\\u200E.scr\\u200E\\u200E) at the end\n\n  -mp <n\\u200E\\u200Eum\\u200E\\u200Eber_of_passes>\n      Sets the upper limit of the n\\u200E\\u200Eum\\u200E\\u200Eber of auto-router passes\n      that will be performed\n\n  -l  <language>\n      "en" for English, "de" for German, "zh" for Simplified Chinese, "he" for Hebrew, otherwise it's the system default. English is set by default for unsupported languages.\n\n  -mt <n\\u200E\\u200Eum\\u200E\\u200Eber_of_threads>\n      Sets thread pool size for route optimization. The default is\n      one less than the n\\u200E\\u200Eum\\u200E\\u200Eber of logical processors\\u200E in \\u200Ethe system.\n\n  -us <updating_stratedy>\n      Greedy, Global, Hybrid. Sets board updating strategy for route\n      optimization. The default is greedy. When hybrid is selected,\n      another option "hr" specifies hybrid ratio.\n\n  -hr <m\:n>\n      Sets hybrid ratio\\u200E in \\u200Ethe format of\n      \#_global_optiomal_passes\:\#_prioritized_passes.\n      The default is 1\:1. It's only effective when hybrid strategy\n      is selected.\n\n  -is <selection_strategy>\n      Sequential, random, or prioritized. Sets item selection strategy\n      for route optimization\: sequential, random, prioritized. The \n      default is prioritized. Prioritied stragegy selects items based\n      on scores calculated\\u200E in \\u200Eprevious round.\n\n  -h Shows this help\n

