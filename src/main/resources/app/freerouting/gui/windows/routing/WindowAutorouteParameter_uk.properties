active=Активний
active_tooltip=Дозволити автотрасувальнику розводити доріжки на цьому шарі.
against_preferred_direction=Проти бажаного напрямку
against_preferred_direction_tooltip=Вартість трасування доріжки проти бажаного напрямку. Більша вартість стримує трасування на цьому шарі у перпендикулярному напрямку.
apply_values_note=Натисніть «Застосувати», щоб використати поточні значення.
autoroute=Автоматичне трасування
autoroute_tooltip=Під час етапу автоматичного трасування автотрасувальник встановлює електричні з'єднання, розміщуючи доріжки та перехідні отвори.
bend_cost=Вартість згину
bend_cost_tooltip=Штраф за згин для кожного шару, який додається до вартості розширення кожного разу, коли автотрасувальник змінює напрямок на цьому шарі. Допустимий діапазон: від 0.0 (без штрафу; за замовчуванням) до 9.9 (сильно перешкоджає згинам). Установіть високе значення для одностороннього шару або шару перемичок, щоб віддати перевагу прямим доріжкам.
detail_autoroute_parameter=Розширені налаштування автотрасувальника
detail_parameter=Розширені налаштування
fanout=Виведення доріжок
fanout_tooltip=Етап виведення доріжок створює початкові перехідні отвори та короткі сегменти доріжок від контактних майданчиків щільних компонентів (наприклад, BGA) до інших шарів плати.
fast=Швидко
horizontal=Горизонтально
in_preferred_direction=У бажаному напрямку
in_preferred_direction_tooltip=Вартість трасування доріжки у бажаному напрямку. Менша вартість стимулює трасування на цьому шарі у цьому напрямку.
job_timeout=Таймаут завдання:
job_timeout_tooltip=Задайте таймаут трасування. Значення обмежене чотирма тижнями.
layer=Шар
layer_tooltip=Перелічує шари, налаштовані на платі для трасування.
max_passes=Макс. кількість проходів:
max_passes_tooltip=Задає максимальну кількість проходів трасування. Вкажіть 0, щоб зняти обмеження.
max_threads=Макс. кількість потоків трасування:
max_threads_tooltip=Кількість потоків трасування. Значення 1 використовує одне ядро ЦП; вищі значення задіюють більше ядер, аж до ліміту цієї машини.
optimization=Оптимізація
optimization_tooltip=Під час етапу оптимізації початкові маршрути вдосконалюються для покращення загальної якості проєкту.
plane_via_costs=Вартість переходу на площину:
plane_via_costs_tooltip=Вартість перехідного отвору, використовуваного під час підключення кола до силової або земляної площини.
power_layer_tooltip=Вимкнено, оскільки це не сигнальний шар і він не може використовуватися для звичайного трасування доріжок.
preferred_direction=Переважний напрямок
preferred_direction_tooltip=Установіть переважний напрямок трасування на цьому шарі: горизонтальний або вертикальний.
routing_stages=Етапи трасування:
routing_stages_tooltip=Виберіть етапи трасування для виконання під час завдання.
slow=Повільно
speed=Швидкість:
start_pass=Початковий прохід:
start_ripup_costs=Початкова вартість зняття:
start_ripup_costs_tooltip=Початковий штраф за зняття наявних доріжок. Вищі значення зменшують імовірність того, що автотрасувальник скасує виконану роботу.
timeout_unit_days=Дні
timeout_unit_hours=Години
timeout_unit_minutes=Хвилини
timeout_unit_weeks=Тижні
title=Налаштування автотрасувальника
trace_costs_on_layer=Вартість доріжок за шаром
trace_costs_on_layer_tooltip=Налаштуйте модифікатори вартості розширення для кожного шару плати.
vertical=Вертикально
via_costs=Вартість переходів:
via_costs_tooltip=Вартість зміни шарів за допомогою перехідного отвору. Вищі значення змушують автотрасувальник довше залишатися на поточному шарі.
vias_allowed=Дозволити перехідні отвори:
vias_allowed_tooltip=Дозволити автотрасувальнику змінювати шари шляхом розміщення перехідних отворів.
decoupling=Decoupling Capacitor Pre-Routing
decoupling_tooltip=Pre-routes high-frequency decoupling capacitor loops (power and ground) prior to general autorouting to minimize loop inductance.
decoupling_settings=Decoupling Capacitor Settings
max_strap_length=Max strap length (mm):
max_strap_length_tooltip=Maximum surface trace strap length in millimeters between capacitor pad and IC power/ground pad (0.1 to 50.0 mm).
max_owner_radius=Max IC search radius (mm):
max_owner_radius_tooltip=Maximum search radius in millimeters around capacitor to locate candidate IC power pins (0.5 to 100.0 mm).
trace_width_scale=Trace width multiplier:
trace_width_scale_tooltip=Multiplier applied to net clearance class trace width for low-impedance decoupling loops (0.5 to 5.0).
lock_mode=Item lock strategy:
lock_mode_tooltip=Locking strategy applied to pre-routed decoupling traces and vias across subsequent routing stages.
lock_mode_hard=Hard Lock (Immune to Rip-up)
lock_mode_soft=Soft Lock (Protected with Rip-up Penalty)
lock_mode_none=Unlocked (Standard Rip-up)
ripup_cost_multiplier=Rip-up penalty multiplier:
ripup_cost_multiplier_tooltip=Cost multiplier applied when the autorouter or optimizer evaluates ripping up soft-locked decoupling items (1.0 to 50.0).
opposite_side_routing=Route opposite-side capacitors (e.g. under BGA)
opposite_side_routing_tooltip=Enables via-in-pad / adjacent via escape pairing for decoupling capacitors mounted on the opposite PCB side beneath ICs.
mutual_inductance_bias=Favor mutual-inductance via flaking
mutual_inductance_bias_tooltip=Prefers via placement configurations that maximize cancellation between supply and return currents.
