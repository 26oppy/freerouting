active=Hoạt động
active_tooltip=Cho phép bộ định tuyến tự động đi các đường đồng trên lớp này.
against_preferred_direction=Ngược hướng ưu tiên
against_preferred_direction_tooltip=Chi phí định tuyến đường đồng ngược hướng ưu tiên. Chi phí cao hơn sẽ hạn chế định tuyến trên lớp này theo hướng vuông góc.
apply_values_note=Nhấp vào Áp dụng để sử dụng các giá trị hiện tại.
autoroute=Định tuyến tự động
autoroute_tooltip=Trong giai đoạn định tuyến tự động, bộ định tuyến tự động thiết lập các kết nối điện bằng cách đặt các đường đồng và via.
bend_cost=Chi phí gập
bend_cost_tooltip=Hình phạt gập trên từng lớp được cộng vào chi phí mở rộng mỗi khi bộ định tuyến đổi hướng trên lớp này. Phạm vi hợp lệ: 0.0 (không phạt; mặc định) đến 9.9 (hạn chế tối đa việc gập). Đặt giá trị cao trên lớp một mặt hoặc lớp dây nhảy để ưu tiên các đường đồng thẳng.
decoupling=Định tuyến trước tụ tách nhiễu
decoupling_settings=Cài đặt tụ tách nhiễu
decoupling_tooltip=Định tuyến trước các vòng tụ tách nhiễu tần số cao (nguồn và đất) trước khi định tuyến tự động để giảm thiểu độ tự cảm vòng.
detail_autoroute_parameter=Cài đặt bộ định tuyến tự động nâng cao
detail_parameter=Cài đặt nâng cao
fanout=Fanout
fanout_tooltip=Giai đoạn fanout tạo các via ban đầu và các đoạn đường đồng ngắn từ các pad linh kiện dày đặc (như pad BGA) sang các lớp PCB khác.
fast=Nhanh
horizontal=Ngang
in_preferred_direction=Theo hướng ưu tiên
in_preferred_direction_tooltip=Chi phí định tuyến đường đồng theo hướng ưu tiên. Chi phí thấp hơn sẽ khuyến khích định tuyến trên lớp này theo hướng đó.
job_timeout=Thời gian chờ tác vụ:
job_timeout_tooltip=Đặt thời gian chờ định tuyến. Giá trị tối đa được giới hạn là bốn tuần.
layer=Lớp
layer_tooltip=Liệt kê các lớp được cấu hình trên bo mạch định tuyến.
lock_mode=Chiến lược khóa đối tượng:
lock_mode_hard=Khóa cứng (miễn nhiễm với việc gỡ bỏ)
lock_mode_none=Mở khóa (gỡ bỏ tiêu chuẩn)
lock_mode_soft=Khóa mềm (được bảo vệ bằng mức phạt)
lock_mode_tooltip=Chiến lược khóa áp dụng cho đường mạch và lỗ xuyên (via) đã định tuyến trước trong các giai đoạn tiếp theo.
max_owner_radius=Bán kính tìm kiếm IC tối đa (mm):
max_owner_radius_tooltip=Bán kính tìm kiếm tối đa tính bằng mm xung quanh tụ điện để xác định chân nguồn của IC (0,5 đến 100,0 mm).
max_passes=Số lượt định tuyến tối đa:
max_passes_tooltip=Đặt số lượt định tuyến tối đa. Nhập 0 để không giới hạn.
max_strap_length=Chiều dài dây nối tối đa (mm):
max_strap_length_tooltip=Chiều dài đường mạch bề mặt tối đa tính bằng mm giữa chân tụ điện và chân nguồn/đất của IC (0,1 đến 50,0 mm).
max_threads=Số luồng định tuyến tối đa:
max_threads_tooltip=Số luồng định tuyến. 1 sử dụng một nhân CPU; giá trị cao hơn sử dụng nhiều nhân hơn, tối đa theo giới hạn của máy này.
mutual_inductance_bias=Ưu tiên triệt tiêu độ hỗ cảm của via
mutual_inductance_bias_tooltip=Ưu tiên cấu hình đặt via giúp tối đa hóa khả năng triệt tiêu giữa dòng cấp và dòng hồi tiếp.
opposite_side_routing=Định tuyến tụ điện mặt đối diện (ví dụ: dưới BGA)
opposite_side_routing_tooltip=Bật ghép nối via-in-pad / via lân cận cho các tụ điện gắn ở mặt đối diện PCB dưới IC.
optimization=Tối ưu hóa
optimization_tooltip=Trong giai đoạn tối ưu hóa, các đường định tuyến ban đầu được tinh chỉnh để cải thiện toàn bộ thiết kế.
plane_via_costs=Chi phí via mặt phẳng nguồn / mặt đất:
plane_via_costs_tooltip=Chi phí via khi mạng nối vào mặt phẳng nguồn hoặc mặt đất.
power_layer_tooltip=Bị vô hiệu hóa vì đây không phải là lớp tín hiệu và không thể dùng để đi đường đồng thông thường.
preferred_direction=Hướng định tuyến ưu tiên
preferred_direction_tooltip=Đặt hướng định tuyến ưu tiên cho đường đồng trên lớp này thành nằm ngang hoặc thẳng đứng.
ripup_cost_multiplier=Hệ số nhân phạt khi gỡ bỏ:
ripup_cost_multiplier_tooltip=Hệ số chi phí áp dụng khi đánh giá việc gỡ bỏ các đối tượng khóa mềm (1,0 đến 50,0).
routing_stages=Các giai đoạn định tuyến:
routing_stages_tooltip=Chọn các giai đoạn định tuyến cần chạy trong quá trình thực hiện.
slow=Chậm
speed=Tốc độ:
start_pass=Lượt bắt đầu:
start_ripup_costs=Chi phí bắt đầu gỡ đường:
start_ripup_costs_tooltip=Mức phạt ban đầu khi gỡ bỏ đường đồng hiện có. Giá trị cao hơn khiến bộ định tuyến ít hủy bỏ công việc đã làm hơn.
timeout_unit_days=Ngày
timeout_unit_hours=Giờ
timeout_unit_minutes=Phút
timeout_unit_weeks=Tuần
title=Cài đặt bộ định tuyến tự động
trace_costs_on_layer=Chi phí đường đồng theo lớp
trace_costs_on_layer_tooltip=Cấu hình hệ số chi phí mở rộng cho từng lớp bo mạch.
trace_width_scale=Hệ số nhân độ rộng đường mạch:
trace_width_scale_tooltip=Hệ số nhân áp dụng cho độ rộng đường mạch đối với các vòng tách nhiễu trở kháng thấp (0,5 đến 5,0).
vertical=Dọc
via_costs=Chi phí via:
via_costs_tooltip=Chi phí chuyển lớp bằng via. Giá trị cao hơn giữ bộ định tuyến ở lại lớp hiện tại lâu hơn.
vias_allowed=Cho phép dùng via:
vias_allowed_tooltip=Cho phép bộ định tuyến tự động chuyển lớp bằng cách đặt các via.
