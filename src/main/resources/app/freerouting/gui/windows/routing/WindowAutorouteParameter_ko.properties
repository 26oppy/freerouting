active=활성
active_tooltip=자동 배선기가 이 레이어에서 트레이스를 배선할 수 있도록 활성화합니다.
against_preferred_direction=선호 방향 반대
against_preferred_direction_tooltip=선호 방향 반대로 트레이스를 배선하는 비용입니다. 비용이 높을수록 이 레이어에서 수직 방향으로의 배선을 억제합니다.
apply_values_note=현재 값을 사용하려면 적용을 클릭하세요.
autoroute=자동 배선
autoroute_tooltip=자동 배선 단계 동안 자동 배선기는 트레이스와 비아를 배치하여 전기적 연결을 생성합니다.
bend_cost=굴곡 비용
bend_cost_tooltip=자동 배선기가 이 레이어에서 방향을 바꿀 때마다 확장 비용에 추가되는 레이어별 굴곡 페널티입니다. 유효 범위: 0.0(페널티 없음; 기본값) ~ 9.9(굴곡을 강력히 억제). 단면 또는 점프 와이어 레이어에서 직진 트레이스를 선호하려면 높은 값을 설정하십시오.
decoupling=디커플링 커패시터 사전 라우팅
decoupling_settings=디커플링 커패시터 설정
decoupling_tooltip=루프 인덕턴스를 최소화하기 위해 전체 자동 라우팅 전에 고주파 디커플링 커패시터 루프(전원 및 접지)를 사전 라우팅합니다.
detail_autoroute_parameter=고급 자동 배선기 설정
detail_parameter=고급 설정
fanout=팬아웃
fanout_tooltip=팬아웃 단계에서는 고밀도 부품 패드(BGA 패드 등)에서 다른 PCB 레이어로 이어지는 초기 비아와 짧은 트레이스 구간을 생성합니다.
fast=빠름
horizontal=수평
in_preferred_direction=선호 배선 방향
in_preferred_direction_tooltip=선호 배선 방향으로 트레이스를 배선하는 비용입니다. 비용이 낮을수록 이 레이어에서 해당 방향으로의 배선을 장려합니다.
job_timeout=작업 시간 초과:
job_timeout_tooltip=배선 시간 초과를 설정합니다. 최댓값은 4주로 제한됩니다.
layer=레이어
layer_tooltip=배선 보드에 설정된 레이어 목록을 표시합니다.
lock_mode=항목 잠금 전략:
lock_mode_hard=하드 잠금 (해제 불가)
lock_mode_none=잠금 해제 (표준 해제)
lock_mode_soft=소프트 잠금 (페널티 적용 보호)
lock_mode_tooltip=이후 라우팅 단계에서 사전 라우팅된 디커플링 트레이스 및 비아에 적용되는 잠금 전략.
max_owner_radius=최대 IC 검색 반경 (mm):
max_owner_radius_tooltip=후보 IC 전원 핀을 찾기 위한 커패시터 주변의 최대 검색 반경 (0.5 ~ 100.0 mm).
max_passes=최대 배선 패스 수:
max_passes_tooltip=최대 배선 패스 수를 설정합니다. 제한을 두지 않으려면 0을 사용하십시오.
max_strap_length=최대 연결선 길이 (mm):
max_strap_length_tooltip=커패시터 패드와 IC 전원/접지 패드 사이의 최대 표면 트레이스 길이 (0.1 ~ 50.0 mm).
max_threads=최대 배선 스레드 수:
max_threads_tooltip=배선 스레드의 수입니다. 1은 하나의 CPU 코어를 사용하며, 높은 값일수록 이 컴퓨터의 제한까지 더 많은 코어를 사용합니다.
mutual_inductance_bias=상호 인덕턴스 상쇄 비아 배치 선호
mutual_inductance_bias_tooltip=공급 전류와 귀환 전류 간의 상쇄를 극대화하는 비아 배치 구성을 선호합니다.
opposite_side_routing=반대면 커패시터 라우팅 (예: BGA 하단)
opposite_side_routing_tooltip=IC 하단 반대쪽 PCB 면에 실장된 커패시터를 위한 비아 인 패드 / 인접 탈출 비아 페어링을 활성화합니다.
optimization=최적화
optimization_tooltip=최적화 단계 동안 초기 배선을 정리하여 전체 설계를 개선합니다.
plane_via_costs=플레인 비아 비용:
plane_via_costs_tooltip=네트가 파워 플레인 또는 접지면에 연결될 때 사용되는 비아의 비용입니다.
power_layer_tooltip=시그널 레이어가 아니므로 일반 트레이스 배선에 사용할 수 없어 비활성화되었습니다.
preferred_direction=선호 배선 방향
preferred_direction_tooltip=이 레이어의 선호 배선 방향을 수평 또는 수직으로 설정합니다.
ripup_cost_multiplier=해제 페널티 배율:
ripup_cost_multiplier_tooltip=소프트 잠금된 디커플링 항목을 해제 평가할 때 적용되는 비용 배율 (1.0 ~ 50.0).
routing_stages=배선 단계:
routing_stages_tooltip=작업 중에 실행할 배선 단계를 선택합니다.
slow=느림
speed=속도:
start_pass=시작 패스:
start_ripup_costs=립업 시작 비용:
start_ripup_costs_tooltip=기존 트레이스를 립업할 때 발생하는 초기 페널티입니다. 값이 높을수록 자동 배선기가 기존 작업을 취소할 가능성이 줄어듭니다.
timeout_unit_days=일
timeout_unit_hours=시간
timeout_unit_minutes=분
timeout_unit_weeks=주
title=자동 배선기 설정
trace_costs_on_layer=레이어별 트레이스 비용
trace_costs_on_layer_tooltip=각 보드 레이어의 확장 비용 수정자를 설정합니다.
trace_width_scale=트레이스 폭 배율:
trace_width_scale_tooltip=낮은 임피던스의 디커플링 루프를 위해 네트 간격 클래스 트레이스 폭에 적용되는 배율 (0.5 ~ 5.0).
vertical=수직
via_costs=비아 비용:
via_costs_tooltip=비아로 레이어를 변경할 때 발생하는 비용입니다. 값이 높을수록 자동 배선기가 현재 레이어에 더 오래 머뭅니다.
vias_allowed=비아 허용:
vias_allowed_tooltip=자동 배선기가 비아를 배치하여 레이어를 변경할 수 있도록 허용합니다.
