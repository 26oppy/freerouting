active=Активен
active_tooltip=Разрешить автотрассировщику прокладывать дорожки на этом слое.
against_preferred_direction=Против предпочтительного направления
against_preferred_direction_tooltip=Стоимость трассировки дорожки против предпочтительного направления. Высокая стоимость препятствует трассировке на этом слое в перпендикулярном направлении.
apply_values_note=Нажмите «Применить», чтобы использовать текущие значения.
autoroute=Автоматическая трассировка
autoroute_tooltip=На этапе автоматической трассировки автотрассировщик устанавливает электрические соединения, размещая дорожки и переходные отверстия.
bend_cost=Стоимость изгиба
bend_cost_tooltip=Штраф за изгиб на слое, добавляемый к стоимости расширения при каждом изменении направления трассировки на этом слое. Допустимый диапазон: от 0.0 (без штрафа; по умолчанию) до 9.9 (сильное ограничение изгибов). Установите высокое значение для одностороннего слоя или слоя перемычек, чтобы отдавать предпочтение прямым дорожкам.
decoupling=Предварительная трассировка блокировочных конденсаторов
decoupling_settings=Настройки блокировочных конденсаторов
decoupling_tooltip=Выполняет предварительную трассировку высокочастотных контуров блокировочных конденсаторов (питание и земля) до общей трассировки для снижения индуктивности контура.
detail_autoroute_parameter=Расширенные настройки автотрассировщика
detail_parameter=Расширенные настройки
fanout=Вывод дорожек
fanout_tooltip=Этап вывода дорожек создает начальные переходные отверстия и короткие сегменты дорожек от контактных площадок плотных компонентов (таких как BGA) на другие слои печатной платы.
fast=Быстро
horizontal=Горизонтальное
in_preferred_direction=В предпочтительном направлении
in_preferred_direction_tooltip=Стоимость трассировки дорожки в предпочтительном направлении. Меньшая стоимость стимулирует трассировку на этом слое в данном направлении.
job_timeout=Тайм-аут задачи:
job_timeout_tooltip=Задайте тайм-аут трассировки. Значение ограничено четырьмя неделями.
layer=Слой
layer_tooltip=Отображает список слоев, настроенных на трассируемой плате.
lock_mode=Стратегия фиксации элементов:
lock_mode_hard=Жесткая фиксация (защита от разрыва)
lock_mode_none=Без фиксации (стандартный разрыв)
lock_mode_soft=Мягкая фиксация (защита со штрафом за разрыв)
lock_mode_tooltip=Стратегия фиксации предварительно проложенных проводников и переходных отверстий развязки на последующих этапах.
max_owner_radius=Макс. радиус поиска ИС (мм):
max_owner_radius_tooltip=Максимальный радиус поиска вокруг конденсатора для поиска выводов питания микросхемы (от 0,5 до 100,0 мм).
max_passes=Макс. количество проходов:
max_passes_tooltip=Задайте максимальное количество проходов трассировки. Используйте 0 для снятия ограничений.
max_strap_length=Макс. длина перемычки (мм):
max_strap_length_tooltip=Максимальная длина поверхностного проводника между контактной площадкой конденсатора и выводом питания/земли микросхемы (от 0,1 до 50,0 мм).
max_threads=Макс. количество потоков трассировки:
max_threads_tooltip=Количество потоков трассировки. Значение 1 использует одно ядро ЦП; более высокие значения используют больше ядер вплоть до лимита данного компьютера.
mutual_inductance_bias=Оптимизировать взаимную индуктивность переходных отверстий
mutual_inductance_bias_tooltip=Предпочитать размещение переходных отверстий, максимально компенсирующее токи питания и возврата.
opposite_side_routing=Трассировать конденсаторы на обратной стороне (напр., под BGA)
opposite_side_routing_tooltip=Включает via-in-pad / смежные выводные переходные отверстия для конденсаторов, установленных под микросхемами с обратной стороны платы.
optimization=Оптимизация
optimization_tooltip=На этапе оптимизации начальные трассы улучшаются для повышения общего качества проекта.
plane_via_costs=Стоимость перехода на силовую или земляную плоскость:
plane_via_costs_tooltip=Стоимость переходного отверстия, используемого при подключении цепи к силовой или земляной плоскости.
power_layer_tooltip=Отключено, так как этот слой не является сигнальным и не может использоваться для обычной трассировки дорожек.
preferred_direction=Предпочтительное направление
preferred_direction_tooltip=Задайте предпочтительное направление трассировки на этом слое: горизонтальное или вертикальное.
ripup_cost_multiplier=Множитель штрафа за разрыв:
ripup_cost_multiplier_tooltip=Коэффициент стоимости при оценке разрыва мягко зафиксированных элементов развязки (от 1,0 до 50,0).
routing_stages=Этапы трассировки:
routing_stages_tooltip=Выберите этапы трассировки для выполнения во время задания.
slow=Медленно
speed=Скорость:
start_pass=Начальный проход:
start_ripup_costs=Начальная стоимость снятия:
start_ripup_costs_tooltip=Начальный штраф за удаление существующих дорожек. Чем выше значение, тем меньше вероятность того, что автотрассировщик отменит ранее выполненную работу.
timeout_unit_days=Дни
timeout_unit_hours=Часы
timeout_unit_minutes=Минуты
timeout_unit_weeks=Недели
title=Настройки автотрассировщика
trace_costs_on_layer=Стоимость дорожек по слоям
trace_costs_on_layer_tooltip=Настройка модификаторов стоимости расширения для каждого слоя платы.
trace_width_scale=Множитель ширины проводника:
trace_width_scale_tooltip=Множитель ширины проводника класса зазоров для низкоимпедансных контуров развязки (от 0,5 до 5,0).
vertical=Вертикальное
via_costs=Стоимость переходов:
via_costs_tooltip=Штраф за смену слоя с помощью переходного отверстия. Чем выше значение, тем дольше автотрассировщик остается на текущем слое.
vias_allowed=Переходные отверстия разрешены:
vias_allowed_tooltip=Разрешить автотрассировщику менять слои, размещая переходные отверстия.
