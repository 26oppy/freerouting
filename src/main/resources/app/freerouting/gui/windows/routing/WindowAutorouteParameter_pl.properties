active=Aktywna
active_tooltip=Zezwala automatycznemu trasownikowi na prowadzenie ścieżek na tej warstwie.
against_preferred_direction=Przeciw preferowanemu kierunkowi
against_preferred_direction_tooltip=Koszt trasowania ścieżki przeciw preferowanemu kierunkowi. Wyższy koszt zniechęca do trasowania na tej warstwie w kierunku prostopadłym.
apply_values_note=Kliknij Zastosuj, aby użyć bieżących wartości.
autoroute=Automatyczne trasowanie
autoroute_tooltip=Podczas etapu automatycznego trasowania automatyczny trasownik nawiązuje połączenia elektryczne, umieszczając ścieżki i przelotki.
bend_cost=Koszt załamania
bend_cost_tooltip=Kara za załamanie na danej warstwie dodawana do kosztu ekspansji za każdym razem, gdy trasownik zmienia kierunek na tej warstwie. Prawidłowy zakres: od 0.0 (brak kary; domyślnie) do 9.9 (silnie zniechęca do załamań). Ustaw wysoką wartość dla warstwy jednostronnej lub ze zworami, aby preferować proste ścieżki.
decoupling=Wstępne trasowanie kondensatorów odsprzęgających
decoupling_settings=Ustawienia kondensatorów odsprzęgających
decoupling_tooltip=Wstępnie trasuje pętle wysokoczęstotliwościowych kondensatorów odsprzęgających (zasilanie i masa) przed głównym trasowaniem, aby zminimalizować indukcyjność pętli.
detail_autoroute_parameter=Zaawansowane ustawienia automatycznego trasownika
detail_parameter=Ustawienia zaawansowane
fanout=Wyprowadzenie ścieżek
fanout_tooltip=Etap wyprowadzenia ścieżek tworzy wstępne przelotki i krótkie odcinki ścieżek z gęsto rozmieszczonych padów komponentów (np. BGA) do innych warstw PCB.
fast=Szybko
horizontal=Poziomo
in_preferred_direction=W preferowanym kierunku
in_preferred_direction_tooltip=Koszt trasowania ścieżki w preferowanym kierunku. Niższy koszt zachęca do trasowania na tej warstwie w tym kierunku.
job_timeout=Limit czasu zadania:
job_timeout_tooltip=Ustaw limit czasu trasowania. Wartość jest ograniczona do maksymalnie czterech tygodni.
layer=Warstwa
layer_tooltip=Wyświetla listę warstw skonfigurowanych na trasowanej płytce.
lock_mode=Strategia blokowania elementów:
lock_mode_hard=Twarda blokada (odporna na rozrywanie)
lock_mode_none=Odblokowane (standardowe rozrywanie)
lock_mode_soft=Miękka blokada (chroniona karą za rozrywanie)
lock_mode_tooltip=Strategia blokowania wstępnie wytrasowanych ścieżek i przelotek odsprzęgających na kolejnych etapach trasowania.
max_owner_radius=Maks. promień wyszukiwania układu (mm):
max_owner_radius_tooltip=Maksymalny promień wyszukiwania wokół kondensatora w celu zlokalizowania wyprowadzeń zasilania układu (0,5 do 100,0 mm).
max_passes=Maksymalna liczba przebiegów:
max_passes_tooltip=Ustaw maksymalną liczbę przebiegów trasowania. Wartość 0 oznacza brak limitu.
max_strap_length=Maks. długość połączenia (mm):
max_strap_length_tooltip=Maksymalna długość ścieżki powierzchniowej w milimetrach między polem kondensatora a polem zasilania/masy układu scalonego (0,1 do 50,0 mm).
max_threads=Maksymalna liczba wątków trasowania:
max_threads_tooltip=Liczba wątków trasowania. Wartość 1 używa jednego rdzenia CPU; wyższe wartości używają więcej rdzeni, aż do limitu tego komputera.
mutual_inductance_bias=Preferuj kompensację indukcyjności wzajemnej przelotek
mutual_inductance_bias_tooltip=Preferuje rozmieszczenie przelotek maksymalizujące wzajemne znoszenie się prądów zasilania i powrotnego.
opposite_side_routing=Trasuj kondensatory po przeciwnej stronie (np. pod BGA)
opposite_side_routing_tooltip=Włącza parowanie przelotek w polu lutowniczym / przelotek ucieczkowych dla kondensatorów zamontowanych pod układami scalonymi.
optimization=Optymalizacja
optimization_tooltip=Podczas etapu optymalizacji wstępne trasy są udoskonalane w celu poprawy ogólnej jakości projektu.
plane_via_costs=Koszt przelotki do płaszczyzny zasilania lub masy:
plane_via_costs_tooltip=Koszt przelotki używanej, gdy sieć łączy się z płaszczyzną zasilania lub masy.
power_layer_tooltip=Wyłączone, ponieważ nie jest to warstwa sygnałowa i nie może być używana do zwykłego trasowania ścieżek.
preferred_direction=Preferowany kierunek trasowania
preferred_direction_tooltip=Ustawia preferowany kierunek trasowania ścieżek na tej warstwie na poziomy lub pionowy.
ripup_cost_multiplier=Mnożnik kary za rozrywanie:
ripup_cost_multiplier_tooltip=Mnożnik kosztu stosowany przy rozrywaniu miękko zablokowanych elementów odsprzęgających (1,0 do 50,0).
routing_stages=Etapy trasowania:
routing_stages_tooltip=Wybierz etapy trasowania do uruchomienia podczas zadania.
slow=Wolno
speed=Prędkość:
start_pass=Przebieg startowy:
start_ripup_costs=Koszt początkowy zrywania:
start_ripup_costs_tooltip=Początkowa kara za usuwanie istniejących ścieżek. Wyższe wartości sprawiają, że trasownik rzadziej cofa wykonaną pracę.
timeout_unit_days=Dni
timeout_unit_hours=Godziny
timeout_unit_minutes=Minuty
timeout_unit_weeks=Tygodnie
title=Ustawienia automatycznego trasownika
trace_costs_on_layer=Koszty ścieżek według warstwy
trace_costs_on_layer_tooltip=Skonfiguruj modyfikatory kosztu ekspansji dla każdej warstwy płytki.
trace_width_scale=Mnożnik szerokości ścieżki:
trace_width_scale_tooltip=Mnożnik stosowany do szerokości ścieżki dla niskoimpedancyjnych pętli odsprzęgających (0,5 do 5,0).
vertical=Pionowo
via_costs=Koszty przelotek:
via_costs_tooltip=Koszt zmiany warstwy za pomocą przelotki. Wyższe wartości sprawiają, że trasownik dłużej pozostaje na bieżącej warstwie.
vias_allowed=Dozwolone przelotki:
vias_allowed_tooltip=Zezwalaj automatycznemu trasownikowi na zmianę warstw poprzez umieszczanie przelotek.
