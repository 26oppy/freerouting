active=Ativo
active_tooltip=Ativa o encaminhador automático para encaminhar pistas de cobre nesta camada.
against_preferred_direction=Contra a direção preferida
against_preferred_direction_tooltip=Custo de encaminhar uma pista contra a direção preferida. Um custo mais alto desincentiva o encaminhamento nesta camada na direção perpendicular.
apply_values_note=Clique em Aplicar para usar os valores atuais.
autoroute=Encaminhamento automático
autoroute_tooltip=Durante a etapa de encaminhamento automático, o encaminhador automático estabelece ligações elétricas colocando pistas de cobre e vias.
bend_cost=Custo de curva
bend_cost_tooltip=Penalização de curva por camada adicionada ao custo de expansão sempre que o encaminhador muda de direção nesta camada. Intervalo válido: 0,0 (sem penalização; predefinição) a 9,9 (desencoraja fortemente as curvas). Defina um valor elevado numa camada de face única ou de fios de salto para favorecer pistas retas.
decoupling=Pré-encaminhamento de condensadores de desacoplamento
decoupling_settings=Definições dos condensadores de desacoplamento
decoupling_tooltip=Pré-encaminha laços de condensadores de desacoplamento de alta frequência (alimentação e terra) antes do encaminhamento geral para minimizar a indutância do laço.
detail_autoroute_parameter=Definições avançadas do encaminhador automático
detail_parameter=Definições avançadas
fanout=Leque de pistas
fanout_tooltip=A etapa de leque de pistas cria vias iniciais e curtos segmentos de pista de cobre a partir de pads de componentes densos (como pads BGA) para outras camadas do PCB.
fast=Rápido
horizontal=Horizontal
in_preferred_direction=Na direção preferida
in_preferred_direction_tooltip=Custo de encaminhar uma pista na direção preferida. Um custo mais baixo incentiva o encaminhamento nesta camada nessa direção.
job_timeout=Tempo limite do trabalho:
job_timeout_tooltip=Define o tempo limite do encaminhamento. O valor está limitado a um máximo de quatro semanas.
layer=Camada
layer_tooltip=Lista as camadas configuradas na placa a encaminhar.
lock_mode=Estratégia de bloqueio de itens:
lock_mode_hard=Bloqueio rígido (imune a remoção)
lock_mode_none=Desbloqueado (remoção normal)
lock_mode_soft=Bloqueio suave (protegido com penalidade)
lock_mode_tooltip=Estratégia de bloqueio aplicada a pistas e vias de desacoplamento pré-encaminhadas durante as etapas subsequentes.
max_owner_radius=Raio máx. de pesquisa do CI (mm):
max_owner_radius_tooltip=Raio máximo de pesquisa em milímetros em torno do condensador para localizar pinos de alimentação do CI (0,5 a 100,0 mm).
max_passes=Passagens máximas de encaminhamento:
max_passes_tooltip=Define o número máximo de passagens de encaminhamento. Utiliza 0 para não ter limite.
max_strap_length=Comprimento máx. de ligação (mm):
max_strap_length_tooltip=Comprimento máximo da pista de superfície em milímetros entre o pad do condensador e o pad de alimentação/terra do CI (0,1 a 50,0 mm).
max_threads=Número máximo de threads de encaminhamento:
max_threads_tooltip=Número de threads de encaminhamento. 1 utiliza um núcleo de CPU; valores mais elevados utilizam mais núcleos, até ao limite desta máquina.
mutual_inductance_bias=Favorecer cancelamento de indutância mútua de vias
mutual_inductance_bias_tooltip=Prefere configurações de posicionamento de vias que maximizam o cancelamento entre correntes de alimentação e retorno.
opposite_side_routing=Encaminhar condensadores do lado oposto (ex.: sob BGA)
opposite_side_routing_tooltip=Permite via-in-pad / vias adjacentes de escape para condensadores montados no lado oposto sob CIs.
optimization=Otimização
optimization_tooltip=Durante a etapa de otimização, as rotas iniciais são melhoradas para aperfeiçoar o desenho global.
plane_via_costs=Custo de via para plano de alimentação ou massa:
plane_via_costs_tooltip=Custo de uma via utilizada quando uma rede se liga a um plano de alimentação ou massa.
power_layer_tooltip=Desativado porque esta não é uma camada de sinal e não pode ser usada para o encaminhamento regular de pistas.
preferred_direction=Direção preferida
preferred_direction_tooltip=Define a direção preferida de encaminhamento nesta camada como horizontal ou vertical.
ripup_cost_multiplier=Multiplicador de penalidade de remoção:
ripup_cost_multiplier_tooltip=Multiplicador de custo aplicado quando o encaminhador avalia remover itens com bloqueio suave (1,0 a 50,0).
routing_stages=Etapas de encaminhamento:
routing_stages_tooltip=Selecione as etapas de encaminhamento a executar durante a tarefa.
slow=Lento
speed=Velocidade:
start_pass=Passagem inicial:
start_ripup_costs=Custo inicial de remoção:
start_ripup_costs_tooltip=Penalização inicial por remover pistas de cobre existentes. Valores mais elevados tornam o encaminhador menos propenso a desfazer o trabalho existente.
timeout_unit_days=Dias
timeout_unit_hours=Horas
timeout_unit_minutes=Minutos
timeout_unit_weeks=Semanas
title=Definições do encaminhador automático
trace_costs_on_layer=Custos de pista por camada
trace_costs_on_layer_tooltip=Configure os modificadores do custo de expansão para cada camada da placa.
trace_width_scale=Multiplicador de largura de pista:
trace_width_scale_tooltip=Multiplicador aplicado à largura de pista da classe de espaçamento para laços de desacoplamento de baixa impedância (0,5 a 5,0).
vertical=Vertical
via_costs=Custos de via:
via_costs_tooltip=Custo de mudar de camada com uma via. Valores mais elevados mantêm o encaminhador na camada atual durante mais tempo.
vias_allowed=Vias permitidas:
vias_allowed_tooltip=Permitir que o encaminhador automático mude de camada colocando vias.
