active=Active
active_tooltip=Autoriser l’autorouteur à router des pistes sur cette couche.
against_preferred_direction=Contre la direction préférée
against_preferred_direction_tooltip=Coût de routage d’une piste contre la direction préférée. Un coût plus élevé décourage le routage sur cette couche dans la direction perpendiculaire.
apply_values_note=Cliquez sur Appliquer pour utiliser les valeurs actuelles.
autoroute=Routage automatique
autoroute_tooltip=Pendant l’étape de routage automatique, l’autorouteur établit les connexions électriques en plaçant des pistes et des vias.
bend_cost=Coût de courbure
bend_cost_tooltip=Pénalité de courbure par couche ajoutée au coût d'expansion à chaque changement de direction du routeur sur cette couche. Plage valide : 0,0 (sans pénalité ; par défaut) à 9,9 (décourage fortement les courbures). Définissez une valeur élevée sur une couche simple face ou à straps pour favoriser des pistes droites.
decoupling=Pré-routage des condensateurs de découplage
decoupling_settings=Paramètres des condensateurs de découplage
decoupling_tooltip=Pré-route les boucles de condensateurs de découplage haute fréquence (alimentation et masse) avant le routage général pour minimiser l'inductance de boucle.
detail_autoroute_parameter=Paramètres avancés de l'autorouteur
detail_parameter=Paramètres avancés
fanout=Éventail de pistes
fanout_tooltip=L’étape d’éventail de pistes crée des vias initiaux et de courts segments de piste depuis les pastilles de composants denses (tels que les BGA) vers d’autres couches du PCB.
fast=Rapide
horizontal=Horizontale
in_preferred_direction=En direction préférée
in_preferred_direction_tooltip=Coût de routage d’une piste dans la direction préférée. Un coût plus bas encourage le routage sur cette couche dans cette direction.
job_timeout=Délai d’expiration de la tâche :
job_timeout_tooltip=Définir le délai d’expiration du routage. La valeur est plafonnée à quatre semaines.
layer=Couche
layer_tooltip=Lyste les couches configurées sur la carte à router.
lock_mode=Stratégie de verrouillage :
lock_mode_hard=Verrouillage fort (immunisé contre le déroutement)
lock_mode_none=Déverrouillé (déroutement standard)
lock_mode_soft=Verrouillage souple (protégé avec pénalité)
lock_mode_tooltip=Stratégie de verrouillage appliquée aux pistes et vias de découplage pré-routés lors des étapes ultérieures.
max_owner_radius=Rayon max. de recherche du CI (mm) :
max_owner_radius_tooltip=Rayon de recherche maximal en millimètres autour du condensateur pour localiser les broches d'alimentation du CI (0,5 à 100,0 mm).
max_passes=Passes de routage maximales :
max_passes_tooltip=Définir le nombre maximal de passes de routage. Utiliser 0 pour aucune limite.
max_strap_length=Longueur max. de liaison (mm) :
max_strap_length_tooltip=Longueur maximale en millimètres de la piste de surface reliant la plage du condensateur au plot d'alimentation/masse du CI (0,1 à 50,0 mm).
max_threads=Threads de routage maximaux :
max_threads_tooltip=Nombre de threads de routage. 1 utilise un seul cœur de processeur ; des valeurs plus élevées utilisent plus de cœurs, dans la limite de cette machine.
mutual_inductance_bias=Favoriser l'annulation d'inductance mutuelle des vias
mutual_inductance_bias_tooltip=Privilégie les configurations de placement de vias maximisant l'annulation entre courants d'alimentation et de retour.
opposite_side_routing=Router les condensateurs côté opposé (ex. sous BGA)
opposite_side_routing_tooltip=Active le couplage via-in-pad / vias d'échappement pour les condensateurs montés sur la face opposée sous les CI.
optimization=Optimisation
optimization_tooltip=Pendant l’étape d’optimisation, les routes initiales sont affinées afin d’améliorer la conception globale.
plane_via_costs=Coût de via vers plan d’alimentation ou de masse :
plane_via_costs_tooltip=Coût d’un via utilisé lorsqu’un réseau se connecte à un plan d’alimentation ou de masse.
power_layer_tooltip=Désactivé car il ne s’agit pas d’une couche signal et elle ne peut pas être utilisée pour le routage de pistes ordinaire.
preferred_direction=Direction préférée
preferred_direction_tooltip=Définir la direction préférée de routage des pistes sur cette couche (horizontale ou verticale).
ripup_cost_multiplier=Multiplicateur de pénalité de déroutement :
ripup_cost_multiplier_tooltip=Multiplicateur de coût appliqué lors de l'évaluation du déroutement d'éléments de découplage verrouillés souplement (1,0 à 50,0).
routing_stages=Étapes de routage :
routing_stages_tooltip=Sélectionnez les étapes de routage à exécuter pendant la tâche.
slow=Lent
speed=Vitesse :
start_pass=Passe de départ :
start_ripup_costs=Coût initial de déroutage :
start_ripup_costs_tooltip=Pénalité initiale pour la suppression de pistes existantes. Des valeurs plus élevées réduisent la probabilité que le routeur annule le travail existant.
timeout_unit_days=Jours
timeout_unit_hours=Heures
timeout_unit_minutes=Minutes
timeout_unit_weeks=Semaines
title=Paramètres de l'autorouteur
trace_costs_on_layer=Coûts de piste par couche
trace_costs_on_layer_tooltip=Configurez les modificateurs de coût d’expansion pour chaque couche de la carte.
trace_width_scale=Multiplicateur de largeur de piste :
trace_width_scale_tooltip=Multiplicateur appliqué à la largeur de piste de la classe d'isolement pour des boucles de découplage à faible impédance (0,5 à 5,0).
vertical=Verticale
via_costs=Coûts de via :
via_costs_tooltip=Coût d’un changement de couche avec un via. Des valeurs plus élevées incitent le routeur à rester plus longtemps sur la couche actuelle.
vias_allowed=Vias autorisés :
vias_allowed_tooltip=Autoriser l'autorouteur à changer de couche en plaçant des vias.
