active=啟用
active_tooltip=允許自動佈線器在此層上進行走線佈線。
against_preferred_direction=逆優先方向
against_preferred_direction_tooltip=逆優先方向走線的代價。代價越高越抑制在該層沿垂直方向佈線。
apply_values_note=按一下「套用」以使用目前的數值。
autoroute=自動佈線
autoroute_tooltip=在自動佈線階段，自動佈線器會透過放置走線和導通孔來建立電氣連接。
bend_cost=轉彎代價
bend_cost_tooltip=每當自動佈線器在此層改變方向時，新增至擴展代價中的單層轉彎懲罰。有效範圍：0.0（無懲罰；預設值）至 9.9（強烈不建議轉彎）。在單面層或跳線層上設定較高值，以優先選擇直線走線。
decoupling=去耦電容預佈線
decoupling_settings=去耦電容設定
decoupling_tooltip=在整體自動佈線前預佈高頻去耦電容迴路（電源與接地），以最大限度減小迴路電感。
detail_autoroute_parameter=自動佈線器進階設定
detail_parameter=進階設定
fanout=扇出
fanout_tooltip=扇出階段會從高密度元件焊盤（例如 BGA 焊盤）建立初始導通孔和短走線段至 PCB 的其他層。
fast=快速
horizontal=水平
in_preferred_direction=沿優先方向
in_preferred_direction_tooltip=沿優先方向走線的代價。代價越低越鼓勵在該層沿該方向佈線。
job_timeout=作業逾時時間：
job_timeout_tooltip=設定佈線逾時時間。最大值上限為四周。
layer=層
layer_tooltip=列出佈線板上已設定的層。
lock_mode=物件鎖定策略:
lock_mode_hard=硬鎖定（免疫拆線）
lock_mode_none=未鎖定（標準拆線）
lock_mode_soft=軟鎖定（受拆線懲罰保護）
lock_mode_tooltip=套用於後續佈線階段中預佈去耦走線與貫孔的鎖定策略。
max_owner_radius=最大晶片搜尋半徑 (mm):
max_owner_radius_tooltip=在電容周圍尋找目標晶片電源引腳的最大搜尋半徑，單位毫米 (0.5 至 100.0 mm)。
max_passes=最大佈線輪次：
max_passes_tooltip=設定最大的佈線輪次。設為 0 表示無限制。
max_strap_length=最大連接線長度 (mm):
max_strap_length_tooltip=電容焊盤與晶片電源/接地焊盤之間的最大表層走線長度，單位毫米 (0.1 至 50.0 mm)。
max_threads=最大佈線執行緒數：
max_threads_tooltip=佈線執行緒的數量。1 表示使用單核 CPU；數值越高表示使用更多 CPU 核心，最高不超過本機上限。
mutual_inductance_bias=優先互感對消貫孔佈局
mutual_inductance_bias_tooltip=優先採用最大程度抵消供電與返回電流之間磁場的貫孔放置構型。
opposite_side_routing=佈線背面電容（例如 BGA 下方）
opposite_side_routing_tooltip=為安裝在晶片下方 PCB 背面的去耦電容啟用盤中孔 / 相鄰引出貫孔配對。
optimization=最佳化
optimization_tooltip=在最佳化階段，會改善初始路徑以提升整體設計品質。
plane_via_costs=電源平面或地平面導通孔代價：
plane_via_costs_tooltip=網路連接至電源或地平面時使用導通孔的代價。
power_layer_tooltip=已停用，因為此層不是訊號層，無法用於一般走線佈線。
preferred_direction=優先佈線方向
preferred_direction_tooltip=將此層的優先佈線方向設定為水平或垂直。
ripup_cost_multiplier=拆線懲罰倍數:
ripup_cost_multiplier_tooltip=自動佈線器或最佳化器評估拆除軟鎖定去耦物件時套用的成本倍數 (1.0 至 50.0)。
routing_stages=佈線階段：
routing_stages_tooltip=選擇要在任務期間執行的佈線階段。
slow=慢速
speed=速度：
start_pass=起始輪次：
start_ripup_costs=拆線起始代價：
start_ripup_costs_tooltip=拆除既有走線的初始懲罰。數值越高，自動佈線器撤銷既有佈線的可能性越低。
timeout_unit_days=天
timeout_unit_hours=小時
timeout_unit_minutes=分鐘
timeout_unit_weeks=週
title=自動佈線器設定
trace_costs_on_layer=按層劃分的走線代價
trace_costs_on_layer_tooltip=配置每個板層的擴展代價修正值。
trace_width_scale=走線線寬倍數:
trace_width_scale_tooltip=套用於網路間距類線寬的倍數，用於獲得低阻抗去耦迴路 (0.5 至 5.0)。
vertical=垂直
via_costs=導通孔代價：
via_costs_tooltip=使用導通孔切換圖層的代價。數值越高，自動佈線器越傾向保持在當前圖層。
vias_allowed=允許導通孔：
vias_allowed_tooltip=允許自動佈線器透過放置導通孔來切換層。
