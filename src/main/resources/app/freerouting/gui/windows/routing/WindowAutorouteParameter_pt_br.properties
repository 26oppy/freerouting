active=Ativa
active_tooltip=Permite que o roteador automático roteie trilhas nesta camada.
against_preferred_direction=Contra a direção preferencial
against_preferred_direction_tooltip=Custo de roteamento de uma trilha de cobre contra a direção preferencial. Um custo maior desestimula o roteamento nesta camada na direção perpendicular.
apply_values_note=Clique em Aplicar para usar os valores atuais.
autoroute=Roteamento automático
autoroute_tooltip=Durante a etapa de Roteamento automático, o roteador automático estabelece conexões elétricas inserindo trilhas e vias.
bend_cost=Custo de curva
bend_cost_tooltip=Penalidade de curva por camada adicionada ao custo de expansão cada vez que o roteador muda de direção nesta camada. Intervalo válido: 0,0 (sem penalidade; padrão) a 9,9 (desencoraja Fortemente as curvas). Defina um valor alto em uma camada de face simples ou com fios de jump para favorecer trilhas retas.
detail_autoroute_parameter=Configurações Avançadas do Roteador Automático
detail_parameter=Configurações avançadas
fanout=Leque de trilhas
fanout_tooltip=A etapa de leque de trilhas cria vias iniciais e pequenos segmentos de trilha a partir de pads de componentes densos (como pads BGA) para outras camadas do PCB.
fast=Rápida
horizontal=Horizontal
in_preferred_direction=Na direção preferencial
in_preferred_direction_tooltip=Custo de roteamento de uma trilha de cobre na direção preferencial. Um custo menor incentiva o roteamento nesta camada nessa direção.
job_timeout=Tempo limite da tarefa:
job_timeout_tooltip=Define o tempo limite de roteamento. O valor é limitado a quatro semanas.
layer=Camada
layer_tooltip=Lista as camadas configuradas na placa de roteamento.
max_passes=Número máximo de passagens de roteamento:
max_passes_tooltip=Define o número máximo de passagens de roteamento. Use 0 para ilimitado.
max_threads=Número máximo de threads de roteamento:
max_threads_tooltip=Número de threads de roteamento. 1 usa um núcleo de CPU; valores mais altos usam mais núcleos, até o limite desta máquina.
optimization=Otimização
optimization_tooltip=Durante a etapa de otimização, os roteamentos iniciais são refinados para melhorar o projeto como um todo.
plane_via_costs=Custo de via para plano de alimentação ou terra:
plane_via_costs_tooltip=Custo de uma via usada quando uma rede se conecta a um plano de alimentação ou terra.
power_layer_tooltip=Desativado porque esta não é uma camada de sinal e não pode ser usada para o roteamento regular de trilhas de cobre.
preferred_direction=Direção Preferencial
preferred_direction_tooltip=Define a direção preferida de roteamento das trilhas nesta camada como horizontal ou vertical.
routing_stages=Etapas de Roteamento:
routing_stages_tooltip=Selecione as etapas de roteamento a serem executadas durante a tarefa.
slow=Lenta
speed=Velocidade:
start_pass=Passagem inicial:
start_ripup_costs=Custo inicial de remoção:
start_ripup_costs_tooltip=Penalidade inicial para remover trilhas de cobre existentes. Valores mais altos tornam o roteador menos propenso a desfazer o trabalho existente.
timeout_unit_days=Dias
timeout_unit_hours=Horas
timeout_unit_minutes=Minutos
timeout_unit_weeks=Semanas
title=Configuração do Roteador
trace_costs_on_layer=Custos de trilha por camada
trace_costs_on_layer_tooltip=Configure os modificadores de custo de expansão para cada camada da placa.
vertical=Vertical
via_costs=Custos de via:
via_costs_tooltip=Custo de mudança de camada com uma via. Valores mais altos mantêm o roteador na camada atual por mais tempo.
vias_allowed=Vias permitidas:
vias_allowed_tooltip=Permite que o roteador automático mude de camada inserindo vias.
decoupling=Pré-roteamento de capacitores de desacoplamento
decoupling_tooltip=Pré-roteia loops de capacitores de desacoplamento de alta frequência (alimentação e terra) antes do roteamento geral para minimizar a indutância do loop.
decoupling_settings=Configurações de capacitores de desacoplamento
max_strap_length=Comprimento máx. de ligação (mm):
max_strap_length_tooltip=Comprimento máximo da trilha de superfície em milímetros entre o pad do capacitor e o pad de alimentação/terra do CI (0.1 a 50.0 mm).
max_owner_radius=Raio máx. de busca de CI (mm):
max_owner_radius_tooltip=Raio máximo de busca em milímetros ao redor do capacitor para localizar pinos de alimentação de CIs candidatos (0.5 a 100.0 mm).
trace_width_scale=Multiplicador de largura da trilha:
trace_width_scale_tooltip=Multiplicador aplicado à largura da trilha da classe de isolamento para loops de desacoplamento de baixa impedância (0.5 a 5.0).
lock_mode=Estratégia de travamento de itens:
lock_mode_tooltip=Estratégia de travamento aplicada a trilhas e vias de desacoplamento pré-roteadas nos estágios subsequentes.
lock_mode_hard=Travamento rígido (imune a remoção)
lock_mode_soft=Travamento suave (protegido com penalidade de remoção)
lock_mode_none=Destravado (remoção normal)
ripup_cost_multiplier=Multiplicador de penalidade de remoção:
ripup_cost_multiplier_tooltip=Multiplicador de custo aplicado quando o autoroteador ou otimizador avalia a remoção de itens com travamento suave (1.0 a 50.0).
opposite_side_routing=Rotear capacitores no lado oposto (ex.: sob BGA)
opposite_side_routing_tooltip=Habilita emparelhamento via-in-pad / via adjacente para capacitores de desacoplamento montados no lado oposto sob CIs.
mutual_inductance_bias=Favorecer arranjo de vias por indutância mútua
mutual_inductance_bias_tooltip=Prefere configurações de vias que maximizam o cancelamento mútuo entre correntes de alimentação e retorno.
