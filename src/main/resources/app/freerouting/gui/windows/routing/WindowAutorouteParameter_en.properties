title=Autorouter Settings
layer=Layer
active=Active
preferred_direction=Preferred Direction
horizontal=Horizontal
vertical=Vertical
detail_parameter=Advanced settings
detail_autoroute_parameter=Advanced Autorouter Settings
trace_costs_on_layer=Trace costs by layer
in_preferred_direction=In preferred direction
against_preferred_direction=Against preferred direction
bend_cost=Bend cost
bend_cost_tooltip=Per-layer bend penalty added to the expansion cost each time the router changes direction on this layer. Valid range: 0.0 (no penalty; default) to 9.9 (strongly discourages bends). Set a high value on a single-sided or jump-wire layer to favor straight traces.
vias_allowed=Vias allowed:
vias_allowed_tooltip=Allow the Autorouter to change layers by placing vias.
via_costs=Via costs:
via_costs_tooltip=Cost of changing layers with a via. Higher values keep the router on the current layer longer.
plane_via_costs=Power or ground plane via cost:
plane_via_costs_tooltip=Cost of a via used when a net connects to a power or ground plane.
start_ripup_costs=Rip-up start cost:
start_ripup_costs_tooltip=Initial penalty for ripping up existing traces. Higher values make the router less likely to undo existing work.
start_pass=Start pass:
speed=Speed:
fast=Fast
slow=Slow
routing_stages=Routing Stages:
max_passes=Maximum routing passes:
max_passes_tooltip=Set the maximum number of routing passes. Use 0 for no limit.
max_threads=Maximum routing threads:
max_threads_tooltip=Number of routing threads. 1 uses one CPU core; higher values use more cores, up to the limit of this machine.
fanout=Fanout
fanout_tooltip=The fanout stage creates initial vias and short trace segments from dense-component pads (such as BGA pads) to other PCB layers.
autoroute=Auto-routing
autoroute_tooltip=During the Auto-routing stage, the Autorouter establishes electrical connections by placing traces and vias.
optimization=Optimization
optimization_tooltip=During the optimization stage, the initial routes are refined to improve the overall design.
job_timeout=Job timeout:
job_timeout_tooltip=Set the routing timeout. The value is capped at four weeks.
timeout_unit_minutes=Minutes
timeout_unit_hours=Hours
timeout_unit_days=Days
timeout_unit_weeks=Weeks
layer_tooltip=Lists the layers configured on the routing board.
active_tooltip=Enable the Autorouter to route traces on this layer.
preferred_direction_tooltip=Set the preferred trace direction on this layer to horizontal or vertical.
trace_costs_on_layer_tooltip=Configure the expansion-cost modifiers for each board layer.
in_preferred_direction_tooltip=Cost of routing a trace in the preferred direction. Lower cost encourages routing on this layer in that direction.
against_preferred_direction_tooltip=Cost of routing a trace against the preferred direction. Higher cost discourages routing on this layer in the perpendicular direction.
routing_stages_tooltip=Select the routing stages to run during the job.
apply_values_note=Click Apply to use the current values.
decoupling=Decoupling Capacitor Pre-Routing
decoupling_tooltip=Pre-routes high-frequency decoupling capacitor loops (power and ground) prior to general autorouting to minimize loop inductance.
decoupling_settings=Decoupling Capacitor Settings
max_strap_length=Max strap length (mm):
max_strap_length_tooltip=Maximum surface trace strap length in millimeters between capacitor pad and IC power/ground pad (0.1 to 50.0 mm).
max_owner_radius=Max IC search radius (mm):
max_owner_radius_tooltip=Maximum search radius in millimeters around capacitor to locate candidate IC power pins (0.5 to 100.0 mm).
trace_width_scale=Trace width multiplier:
trace_width_scale_tooltip=Multiplier applied to net clearance class trace width for low-impedance decoupling loops (0.5 to 5.0).
lock_mode=Item lock strategy:
lock_mode_tooltip=Locking strategy applied to pre-routed decoupling traces and vias across subsequent routing stages.
lock_mode_hard=Hard Lock (Immune to Rip-up)
lock_mode_soft=Soft Lock (Protected with Rip-up Penalty)
lock_mode_none=Unlocked (Standard Rip-up)
ripup_cost_multiplier=Rip-up penalty multiplier:
ripup_cost_multiplier_tooltip=Cost multiplier applied when the autorouter or optimizer evaluates ripping up soft-locked decoupling items (1.0 to 50.0).
opposite_side_routing=Route opposite-side capacitors (e.g. under BGA)
opposite_side_routing_tooltip=Enables via-in-pad / adjacent via escape pairing for decoupling capacitors mounted on the opposite PCB side beneath ICs.
mutual_inductance_bias=Favor mutual-inductance via flaking
mutual_inductance_bias_tooltip=Prefers via placement configurations that maximize cancellation between supply and return currents.
power_layer_tooltip=Disabled because this is not a signal layer and cannot be used for regular trace routing.
