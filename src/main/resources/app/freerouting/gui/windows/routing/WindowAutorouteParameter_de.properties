active=Aktiv
active_tooltip=Aktivieren Sie diese Option, damit der Autorouter Leiterbahnen auf dieser Lage verlegt.
against_preferred_direction=gegen die Vorzugsrichtung
against_preferred_direction_tooltip=Kosten für das Verlegen einer Leiterbahn gegen die Vorzugsrichtung. Höhere Kosten wehren das Entflechten auf dieser Lage in senkrechter Richtung ab.
apply_values_note=Klicken Sie auf Anwenden, um die aktuellen Werte zu übernehmen.
autoroute=Automatisch entflechten
autoroute_tooltip=Während der automatischen Entflechtung stellt der Autorouter elektrische Verbindungen durch Platzieren von Leiterbahnen und Durchkontaktierungen her.
bend_cost=Biegungskosten
bend_cost_tooltip=Lagenbezogene Biegungsstrafe, die bei jedem Richtungswechsel auf dieser Lage zu den Expansionskosten addiert wird. Gültiger Bereich: 0.0 (keine Strafe; Standard) bis 9.9 (starke Vermeidung von Biegungen). Setzen Sie auf einseitigen Lagen oder Drahtbrückenlagen einen hohen Wert, um gerade Leiterbahnen zu bevorzugen.
decoupling=Abblockkondensator-Vorentflechtung
decoupling_settings=Abblockkondensator-Einstellungen
decoupling_tooltip=Entflechtet hochfrequente Abblockkondensator-Schleifen (Versorgung und Masse) vor dem allgemeinen Autorouting, um die Schleifeninduktivität zu minimieren.
detail_autoroute_parameter=Erweiterte Autorouter-Einstellungen
detail_parameter=Erweiterte Einstellungen
fanout=Ausfädeln
fanout_tooltip=Die Ausfädelungsphase erzeugt erste Durchkontaktierungen und kurze Leiterbahnsegmente von Pads dichter Bauteile (z. B. BGA-Pads) zu anderen Lagen.
fast=Schnell
horizontal=Horizontal
in_preferred_direction=Kosten in Vorzugsrichtung
in_preferred_direction_tooltip=Kosten für das Verlegen einer Leiterbahn in der bevorzugten Entflechtungsrichtung. Niedrigere Kosten begünstigen das Entflechten auf dieser Lage in dieser Richtung.
job_timeout=Zeitlimit:
job_timeout_tooltip=Legen Sie das Zeitlimit für die Entflechtung fest. Der Wert ist auf maximal vier Wochen begrenzt.
layer=Lage
layer_tooltip=Listet die auf der Platine konfigurierten Lagen auf.
lock_mode=Objektsperrstrategie:
lock_mode_hard=Feste Sperre (immun gegen Auflösung)
lock_mode_none=Entsperrt (Standard-Auflösung)
lock_mode_soft=Weiche Sperre (geschützt mit Auflösungsstrafe)
lock_mode_tooltip=Sperrstrategie für vorentflochtene Abblockleiterbahnen und Durchkontaktierungen in nachfolgenden Entflechtungsstufen.
max_owner_radius=Maximaler IC-Suchradius (mm):
max_owner_radius_tooltip=Maximaler Suchradius in Millimetern um den Kondensator zur Lokalisierung von IC-Versorgungspins (0,5 bis 100,0 mm).
max_passes=Maximale Durchläufe:
max_passes_tooltip=Legen Sie die maximale Anzahl an Entflechtungsdurchläufen fest. Verwenden Sie 0 für kein Limit.
max_strap_length=Maximale Anbindungslänge (mm):
max_strap_length_tooltip=Maximale Leiterbahnanbindungslänge in Millimetern zwischen Kondensatorpad und IC-Versorgungs-/Massepad (0,1 bis 50,0 mm).
max_threads=Maximale Threads:
max_threads_tooltip=Anzahl der Entflechtungs-Threads. 1 nutzt einen CPU-Kern; höhere Werte nutzen mehr Kerne bis zum Limit dieses Computers.
mutual_inductance_bias=Gegeninduktivitäts-Kompensation bevorzugen
mutual_inductance_bias_tooltip=Bevorzugt Via-Platzierungskonfigurationen, die die gegenseitige Stromauslöschung zwischen Hin- und Rückleiter maximieren.
opposite_side_routing=Gegenüberliegende Kondensatoren entflechten (z. B. unter BGA)
opposite_side_routing_tooltip=Aktiviert Via-in-Pad / benachbarte Durchkontaktierungspaare für auf der Platinenunterseite unter ICs montierte Abblockkondensatoren.
optimization=Optimierung
optimization_tooltip=In der Optimierungsphase werden die ersten Entflechtungen verfeinert, um das Gesamtdesign zu verbessern.
plane_via_costs=Kosten der Versorgungslagen-Durchkontaktierung:
plane_via_costs_tooltip=Kosten einer Durchkontaktierung, die beim Anschluss eines Netzes an eine Versorgungslage oder Massefläche entsteht.
power_layer_tooltip=Deaktiviert, da dies keine Signallage ist und nicht für die reguläre Entflechtung von Leiterbahnen verwendet werden kann.
preferred_direction=Bevorzugte Entflechtungsrichtung
preferred_direction_tooltip=Legen Sie die bevorzugte Entflechtungsrichtung der Leiterbahnen auf dieser Lage auf horizontal oder vertikal fest.
ripup_cost_multiplier=Auflösungsstrafen-Multiplikator:
ripup_cost_multiplier_tooltip=Kostenmultiplikator für das Auflösen weich gesperrter Abblockobjekte (1,0 bis 50,0).
routing_stages=Entflechtungsstufen:
routing_stages_tooltip=Wählen Sie die Entflechtungsstufen aus, die während des Durchlaufs ausgeführt werden sollen.
slow=Langsam
speed=Geschwindigkeit:
start_pass=Start-Durchlauf:
start_ripup_costs=Anfangskosten für das Auflösen:
start_ripup_costs_tooltip=Anfängliche Strafe für das Auflösen vorhandener Leiterbahnen. Höhere Werte verringern die Wahrscheinlichkeit, dass der Router vorhandene Arbeit rückgängig macht.
timeout_unit_days=Tage
timeout_unit_hours=Stunden
timeout_unit_minutes=Minuten
timeout_unit_weeks=Wochen
title=Autorouter-Einstellungen
trace_costs_on_layer=Leiterbahnkosten nach Lage
trace_costs_on_layer_tooltip=Konfigurieren Sie die Modifikatoren der Expansionskosten für jede Platinenlage.
trace_width_scale=Leiterbahnbreiten-Multiplikator:
trace_width_scale_tooltip=Multiplikator für die Leiterbahnbreite der Netzklasse für niederimpedante Abblockschleifen (0,5 bis 5,0).
vertical=Vertikal
via_costs=Via-Kosten:
via_costs_tooltip=Kosten für den Lagenwechsel mit einer Durchkontaktierung. Höhere Werte halten den Router länger auf der aktuellen Lage.
vias_allowed=Durchkontaktierungen erlaubt:
vias_allowed_tooltip=Erlaubt dem Autorouter das Wechseln der Lagen durch Plazieren von Durchkontaktierungen.
