active=Aktiv
active_tooltip=Aktiver den automatiske ruter til at lægge spor på dette lag.
against_preferred_direction=Mod den foretrukne retning
against_preferred_direction_tooltip=Omkostning ved at lægge et kobberspor mod den foretrukne retning. En højere omkostning fraråder sporlægning på dette lag i den vinkelrette retning.
apply_values_note=Klik på Anvend for at bruge de aktuelle værdier.
autoroute=Automatisk sporlægning
autoroute_tooltip=Under fasen med automatisk sporlægning etablerer den automatiske ruter elektriske forbindelser ved at placere spor og viaer.
bend_cost=Bøjningsomkostning
bend_cost_tooltip=Bøjningsstraf pr. lag, der føjes til ekspansionsomkostningen, hver gang ruterne skifter retning på dette lag. Gyldigt område: 0,0 (ingen straf; standard) til 9,9 (fraråder bøjninger kraftigt). Indstil en høj værdi på et enkeltsidet lag eller et springtrådslag for at foretrække lige kobberspor.
detail_autoroute_parameter=Avancerede indstillinger for automatisk ruter
detail_parameter=Avancerede indstillinger
fanout=Udfletning af spor
fanout_tooltip=Udfletningsfasen opretter indledende viaer og korte sporsegmenter fra pads på tætte komponenter (f.eks. BGA-pads) til andre printkortlag.
fast=Hurtig
horizontal=Vandret
in_preferred_direction=I foretrukken retning
in_preferred_direction_tooltip=Omkostning ved at lægge et kobberspor i den foretrukne retning. En lavere omkostning tilskynder til sporlægning på dette lag i den retning.
job_timeout=Tidsudløb for opgave:
job_timeout_tooltip=Angiv tidsudløb for sporlægning. Værdien er begrænset til maksimalt fire uger.
layer=Lag
layer_tooltip=Viser de lag, der er konfigureret på printkortet.
max_passes=Maksimalt antal gennemløb:
max_passes_tooltip=Angiv det maksimale antal gennemløb. Brug 0 for ubegrænset.
max_threads=Maksimalt antal tråde:
max_threads_tooltip=Antal sporlægningstråde. 1 bruger én CPU-kerne; højere værdier bruger flere kerner op til maskinens grænse.
optimization=Optimering
optimization_tooltip=Under optimeringsfasen forbedres de indledende ruter for at optimere det samlede design.
plane_via_costs=Via-omkostning til forsynings- eller jordplan:
plane_via_costs_tooltip=Omkostning for en via der bruges, når et net tilsluttes et forsynings- eller jordplan.
power_layer_tooltip=Deaktiveret fordi dette ikke er et signallag og ikke kan bruges til almindelig sporlægning.
preferred_direction=Foretrukken retning
preferred_direction_tooltip=Vælg den foretrukne routingretning på dette lag til enten vandret eller lodret.
routing_stages=Sporlægningsfaser:
routing_stages_tooltip=Vælg de routing-trin, der skal køres under opgaven.
slow=Langsom
speed=Hastighed:
start_pass=Startgennemløb:
start_ripup_costs=Startomkostning for oprivning:
start_ripup_costs_tooltip=Startstraf for oprivning af eksisterende spor. Højere værdier gør den automatiske ruter mindre tilbøjelig til at fortryde udført arbejde.
timeout_unit_days=Dage
timeout_unit_hours=Timer
timeout_unit_minutes=Minutter
timeout_unit_weeks=Uger
title=Indstillinger for autoruter
trace_costs_on_layer=Sporomkostninger pr. lag
trace_costs_on_layer_tooltip=Konfigurer ændringerne af ekspansionsomkostninger for hvert printkortlag.
vertical=Lodret
via_costs=Via-omkostninger:
via_costs_tooltip=Omkostning ved lagskift med en via. Højere værdier får den automatiske ruter til at blive længere på det nuværende lag.
vias_allowed=Viaer tilladt:
vias_allowed_tooltip=Tillad den automatiske ruter at skifte lag ved at placere viaer.
decoupling=Decoupling Capacitor Pre-Routing
decoupling_tooltip=Pre-routes high-frequency decoupling capacitor loops (power and ground) prior to general autorouting to minimize loop inductance.
decoupling_settings=Decoupling Capacitor Settings
max_strap_length=Max strap length (mm):
max_strap_length_tooltip=Maximum surface trace strap length in millimeters between capacitor pad and IC power/ground pad (0.1 to 50.0 mm).
max_owner_radius=Max IC search radius (mm):
max_owner_radius_tooltip=Maximum search radius in millimeters around capacitor to locate candidate IC power pins (0.5 to 100.0 mm).
trace_width_scale=Trace width multiplier:
trace_width_scale_tooltip=Multiplier applied to net clearance class trace width for low-impedance decoupling loops (0.5 to 5.0).
lock_mode=Item lock strategy:
lock_mode_tooltip=Locking strategy applied to pre-routed decoupling traces and vias across subsequent routing stages.
lock_mode_hard=Hard Lock (Immune to Rip-up)
lock_mode_soft=Soft Lock (Protected with Rip-up Penalty)
lock_mode_none=Unlocked (Standard Rip-up)
ripup_cost_multiplier=Rip-up penalty multiplier:
ripup_cost_multiplier_tooltip=Cost multiplier applied when the autorouter or optimizer evaluates ripping up soft-locked decoupling items (1.0 to 50.0).
opposite_side_routing=Route opposite-side capacitors (e.g. under BGA)
opposite_side_routing_tooltip=Enables via-in-pad / adjacent via escape pairing for decoupling capacitors mounted on the opposite PCB side beneath ICs.
mutual_inductance_bias=Favor mutual-inductance via flaking
mutual_inductance_bias_tooltip=Prefers via placement configurations that maximize cancellation between supply and return currents.
